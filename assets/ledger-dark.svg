<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 488" width="1000" height="488" role="img" aria-labelledby="t d">
<title id="t">Tanu Sree Reddy Gavinnolla, cyber security</title>
<desc id="d">Tanu Sree Reddy Gavinnolla. I find the gaps, then make sure they actually get closed. Findings ledger: 75 to 80 vulnerability assessments closed; EDR agent baselines standardised across 500+ endpoints; MITRE ATT&amp;CK detection logic, about 20% better fidelity; automated revocation and host isolation, about 30% lower MTTR; IDS and firewall tuning, 35% higher accuracy. Next role: open to opportunities.</desc>
