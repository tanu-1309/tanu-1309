<rect x="280" y="172" width="117" height="26" rx="13" fill="#111A2E" stroke="#22304D"/><text class="mono" x="290" y="189.6" font-size="13" fill="#A9B5D0">MITRE ATT&amp;CK</text>
<rect x="280" y="206" width="125" height="26" rx="13" fill="#111A2E" stroke="#22304D"/><text class="mono" x="290" y="223.6" font-size="13" fill="#A9B5D0">EDR platforms</text>
<rect x="280" y="240" width="101" height="26" rx="13" fill="#111A2E" stroke="#22304D"/><text class="mono" x="290" y="257.6" font-size="13" fill="#A9B5D0">IDS tuning</text>
<circle cx="519" cy="40" r="7" fill="#60A5FA"/>
<text class="sans" x="512" y="88" font-size="22" font-weight="700" fill="#E8EEFA" letter-spacing="-0.4">Respond</text>
<text class="sans" x="512" y="112" font-size="14" fill="#A9B5D0">Contain it, fast.</text>
