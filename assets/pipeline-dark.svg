<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 316" width="1000" height="316" role="img" aria-labelledby="t d"><title id="t">How a finding moves</title><desc id="d">How a finding moves. Scan: Find what is exposed. 75–80 assessments. Tools: Qualys VMDR, Nmap, Wireshark. Detect: Separate signal from noise. ~20% better fidelity. Tools: MITRE ATT&amp;CK, EDR platforms, IDS tuning. Respond: Contain it, fast. ~30% lower MTTR. Tools: Python, PowerShell, FortiGate, Volatility 3. Close: Prove the fix held. tracked to closure. Tools: remediation tracking, audit evidence, security documentation.</desc><style>.sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif}.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}</style>
