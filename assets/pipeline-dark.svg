<rect x="48" y="206" width="52" height="26" rx="13" fill="#111A2E" stroke="#22304D"/><text class="mono" x="58" y="223.6" font-size="13" fill="#A9B5D0">Nmap</text>
<rect x="48" y="240" width="93" height="26" rx="13" fill="#111A2E" stroke="#22304D"/><text class="mono" x="58" y="257.6" font-size="13" fill="#A9B5D0">Wireshark</text>
<circle cx="287" cy="40" r="7" fill="#60A5FA"/>
<text class="sans" x="280" y="88" font-size="22" font-weight="700" fill="#E8EEFA" letter-spacing="-0.4">Detect</text>
<text class="sans" x="280" y="112" font-size="14" fill="#A9B5D0">Separate signal from noise.</text>
