<rect x="512" y="206" width="101" height="26" rx="13" fill="#111A2E" stroke="#22304D"/><text class="mono" x="522" y="223.6" font-size="13" fill="#A9B5D0">PowerShell</text>
<rect x="512" y="240" width="93" height="26" rx="13" fill="#111A2E" stroke="#22304D"/><text class="mono" x="522" y="257.6" font-size="13" fill="#A9B5D0">FortiGate</text>
<rect x="512" y="274" width="117" height="26" rx="13" fill="#111A2E" stroke="#22304D"/><text class="mono" x="522" y="291.6" font-size="13" fill="#A9B5D0">Volatility 3</text>
